- type: species
  id: Pony
  name: species-name-pony
  roundStart: true
  prototype: MobPony
  sprites: MobPonySprites
  defaultSkinTone: "#f7b0f0"
  markingLimits: MobPonyMarkingLimits
  dollPrototype: MobPonyDummy
  skinColoration: Hues
  maleFirstNames: NamesPonyFirst
  femaleFirstNames: NamesPonyFirst
  lastNames: NamesPonyLast
  # begin Goobstation: port EE height/width sliders
  minHeight: 0.75
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.80
  defaultWidth: 1
  maxWidth: 1.20
  # end Goobstation: port EE height/width sliders

