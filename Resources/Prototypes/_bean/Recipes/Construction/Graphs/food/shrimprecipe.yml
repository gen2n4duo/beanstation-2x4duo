- type: constructionGraph
  id: CookedJumboShrimp
  start: start
  graph:

  - node: start
    edges:
    - to: cooked shrimp
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: cooked shrimp
    entity: FoodMeatJumboShrimpCooked

- type: constructionGraph
  id: CookedJumboShrimpSlice
  start: start
  graph:

  - node: start
    edges:
    - to: cooked shrimp slice
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: cooked shrimp slice
    entity: FoodMeatJumboShrimpCookedSliced