- type: entity
  save: false
  name: Urist McHooves
  parent: [ BaseMobSpeciesOrganic ]
  id: BaseMobPony
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Pony
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: _bean/Mobs/Species/Pony/parts.rsi
    state: full
  - type: Body
    prototype: Pony
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Pony
  - type: Speech
    speechVerb: Pony
  - type: ReplacementAccent
    accent: ponyspeech
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    - Equestrian
    understands:
    - TauCetiBasic
    - Equestrian
  - type: TypingIndicator
    proto: pony
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Tag
    tags:
    - Pony
  - type: MovementSpeedModifier
    weightlessAcceleration: 3 # Goobstation value
    weightlessFriction: 1
    baseWeightlessModifier: 1
    weightlessModifier: 0.8 # up from 0.7 base
  - type: Sprite # sprite again because we want different layer ordering
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Groin" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
