  markingCategory: Hair
  canBeDisplaced: false
  speciesRestriction: [Pony]
  sprites:
    - sprite: _bean/Mobs/Customization/pony_hair.rsi
      state: testhair

- type: marking
  id: PonyHairLaughter
  bodyPart: Hair
  markingCategory: Hair
  canBeDisplaced: false
  speciesRestriction: [Pony]
  sprites:
    - sprite: _bean/Mobs/Customization/pony_hair.rsi
      state: laughtermane

# tail
- type: marking
  id: PonyTailTest
