      state: testtail

- type: marking
  id: PonyTailLaughter
  bodyPart: Tail
  markingCategory: Tail
  canBeDisplaced: false
  speciesRestriction: [Pony]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SimpleColoring
  sprites:
