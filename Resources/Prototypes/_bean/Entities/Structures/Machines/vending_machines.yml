- type: entity
  parent: VendingMachine
  id: VendingMachineGlow
  name: Glowdrobe
  description: A vending machine containing lights.
  components:
  - type: VendingMachine
    pack: GlowdrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: Advertise
    pack: GlowdrobeAds
  - type: SpeakOnUIClosed
    pack: GlowDrobeGoodbyes
  - type: Speech
  - type: PointLight
    radius: 1.5
    energy: 1.3 # reduced energy since the color is pure white
    color: "#FFFFFF"
  - type: Sprite
    sprite: _bean\Structures\VendingMachines\glow.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: vendingMachineInventory
  id: GlowdrobeInventory
  startingInventory:
    ContactsUnit: 10
    ClothingNeckGlowpinMagenta: 5
    ClothingNeckGlowpinPurple: 5
    ClothingNeckGlowpinBlue: 5
    ClothingNeckGlowpinCyan: 5
    ClothingNeckGlowpinGreen: 5
    ClothingNeckGlowpinYellow: 5
    ClothingNeckGlowpinOrange: 5
    ClothingNeckGlowpinRed: 5
    ClothingNeckGlowpinBase: 5

- type: localizedDataset
  id: GlowdrobeAds
  values:
    prefix: advertisement-glowdr-
    count: 4

- type: localizedDataset
  id: GlowDrobeGoodbyes
  values:
    prefix: thankyou-glowdr-
    count: 3

