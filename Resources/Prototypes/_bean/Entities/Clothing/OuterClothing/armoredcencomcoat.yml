- type: entity
  parent: [ ClothingOuterWinterCoatToggleable, AllowSuitStorageClothing, BaseCentcommContraband ]
  id: ClothingOuterArmoredWinterCentcom
  name: armored centcom winter coat
  description: Makes you feel like you could start a war.
  components:
  - type: Sprite
    sprite: _bean/Clothing/OuterClothing/WinterCoats/armorcentcomcoat.rsi
  - type: Clothing
    sprite: _bean/Clothing/OuterClothing/WinterCoats/armorcentcomcoat.rsi
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHatHoodArmorCentcom
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.67
        Heat: 0.80

