# shoes
- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesColorBlackPony
  name: black shoes
  description: Stylish black shoes.
  suffix: Pony
  components:
  - type: Sprite
    sprite: _bean/Clothing/Various/Ponies/Shoes/color.rsi
    layers:
    - state: icon
      color: "#3f3f3f" #Different from the worn state for contrast reasons.
    - state: soles-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#3f3f3f"
      - state: soles-inhand-left
      right:
      - state: inhand-right
        color: "#3f3f3f"
      - state: soles-inhand-right
  - type: Clothing
    sprite: _bean/Clothing/Various/Ponies/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        color: "#1d1d1d"
      - state: soles-equipped-FEET

# White Shoes
- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesColorWhitePony
  suffix: Pony
  name: white shoes
  description: Don't take them off at your office Christmas party.
  components:
  - type: Sprite
    sprite: _bean/Clothing/Various/Ponies/Shoes/color.rsi
    layers:
    - state: icon
      color: "#EAE8E8" #Deliberately NOT pure white
    - state: soles-icon
  - type: Item
    inhandVisuals: #We don't want the sole icons. Since this is white, it's just going to look weird (white on white doesn't really contrast.)
      left:
      - state: inhand-left
        color: "#EAE8E8"
      right:
      - state: inhand-right
        color: "#EAE8E8"
  - type: Clothing
    sprite: _bean/Clothing/Various/Ponies/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        color: "#EAE8E8"
      - state: contrastedsoles-equipped-FEET

