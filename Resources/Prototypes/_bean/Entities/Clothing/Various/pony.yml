# random clothes
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformRandomPony
  abstract: true
  description: Generated by neural networks based on the latest fashion trends.
  suffix: Random visual, Pony
  components:
  - type: SuitSensor
  - type: Sprite
    sprite: _bean/Clothing/Various/Ponies/procedural.rsi
    layers:
    - state: base_torso_standard
      map: [ "torso" ]
    - state: base_leg_standard
      map: [ "leg" ]
    - state: mask_null
      map: [ "decor" ]
    - state: mask_null
      map: [ "overlay" ]
  - type: Clothing
    sprite: _bean/Clothing/Various/Ponies/procedural.rsi
    clothingVisuals:
      jumpsuit:
      - state: base_torso_standard
        map: [ "torso" ]
      - state: base_leg_standard
        map: [ "leg" ]
      - state: mask_null
        map: [ "decor" ]
      - state: mask_null
        map: [ "overlay" ]

