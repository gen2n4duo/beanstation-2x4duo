- type: entity
  name: raw jumbo shrimp
  parent: FoodMeatRawBase
  id: FoodMeatJumboShrimp
  description: A particularly oversized shrimp.
  components:
  - type: Sprite
    sprite: _bean/Objects/Consumable/Food/jumboshrimp.rsi
    state: rawjumboshrimp
  - type: SliceableFood
    slice: FoodMeatJumboShrimpSliced
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 40
        - ReagentId: Fat
          Quantity: 15
  - type: Construction
    graph: CookedJumboShrimp
    node: start
    defaultTarget: cooked shrimp

- type: entity
  name: cooked jumbo shrimp
  parent: FoodMeatBase
  id: FoodMeatJumboShrimpCooked
  description: May cause crew chaos.
  components:
  - type: Sprite
    sprite: _bean/Objects/Consumable/Food/jumboshrimp.rsi
    state: cookedjumboshrimp
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 40
        - ReagentId: Protein
          Quantity: 15
  - type: Construction
    graph: CookedJumboShrimp
    node: cooked shrimp

# sliced

- type: entity
  name: raw jumbo shrimp slice
  parent: FoodMeatRawBase
  id: FoodMeatJumboShrimpSliced
  description: A cut of a particularly oversized shrimp.
  components:
  - type: Sprite
    sprite: _bean/Objects/Consumable/Food/jumboshrimp.rsi
    state: rawshrimppiece
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 20
        - ReagentId: Fat
          Quantity: 5
  - type: Construction
    graph: CookedJumboShrimpSlice
    node: start
    defaultTarget: cooked shrimp slice

- type: entity
  name: cooked jumbo shrimp slice
  parent: FoodMeatRawBase
  id: FoodMeatJumboShrimpCookedSliced
  description: May cause partial crew chaos.
  components:
  - type: Sprite
    sprite: _bean/Objects/Consumable/Food/jumboshrimp.rsi
    state: cookedshrimppiece
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Protein
          Quantity: 5
  - type: Construction
    graph: CookedJumboShrimpSlice
    node: cooked shrimp slice