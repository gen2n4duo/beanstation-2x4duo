- type: entity
  id: PartPony
  parent: [BaseItem, BasePart]
  name: "pony body part"
  abstract: true
  components:
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Icon # Shitmed Change
    sprite: _bean/Mobs/Species/Pony/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Pony
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Pony

- type: entity
  id: ChestPony
  name: "pony chest"
  parent: [PartPony, BaseChest]
  components:
