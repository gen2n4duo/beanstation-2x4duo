- type: body
  id: Pony
  name: "pony"
  root: chest
  slots:
    head:
      part: HeadPony
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    chest:
      part: ChestPony
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
      connections:
      - right arm
      - left arm
      - groin
      - head # Shitmed
    groin:
      part: GroinPony
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganPonyStomach
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
    right arm:
      part: RightArmPony
      connections:
      - right hand
    left arm:
      part: LeftArmPony
      connections:
      - left hand
    right hand:
      part: RightHandPony
    left hand:
      part: LeftHandPony
    right leg:
      part: RightLegPony
      connections:
      - right foot
    left leg:
      part: LeftLegPony
      connections:
      - left foot
    right foot:
      part: RightFootPony
    left foot:
      part: LeftFootPony